# Same-host minion: runs in the network namespace of the `mariadb` container (compose network_mode: service:mariadb),
# so 127.0.0.1 and localhost are the database server itself, as for a minion installed on the database VM.
id: minion-local-mariadb
master: master
log_level_logfile: debug
e2e_sdb:
  driver: yaml
  files: [/etc/salt/e2e-secrets.yaml]
sqlx:
  profiles:
    local_ro: &ro {dialect: mysql, host: 127.0.0.1, port: 3306, database: sakila, username: ro, password: sdb://e2e_sdb/ro_pw, connect_timeout_s: 5}
    local_name: {<<: *ro, host: localhost}
    local_rw: {<<: *ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false, allow_execute: true}
    local_badpw: {<<: *ro, password: sdb://e2e_sdb/bad_pw}
    local_nopw: {dialect: mysql, host: 127.0.0.1, port: 3306, database: sakila, username: ro, connect_timeout_s: 5}
    local_closed: {<<: *ro, port: 1}
