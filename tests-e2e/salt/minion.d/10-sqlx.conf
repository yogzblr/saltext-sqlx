# sqlx profiles for the end-to-end suite. Hosts are compose service names on the private network. Every password is
# an sdb:// reference into the file-backed `yaml` sdb driver below (/etc/salt/e2e-secrets.yaml, throw-away values).
master: master
log_level_logfile: debug

e2e_sdb:
  driver: yaml
  files:
    - /etc/salt/e2e-secrets.yaml

_e2e_defaults: &d
  connect_timeout_s: 5
  statement_timeout_ms: 30000

sqlx:
  _policy:
    # D16: without this line a call could send the connection (the default since 2026-11-01). The profile-only minion
    # keeps the strict contract that test_e2e_policy.py::test_policy_off_* asserts; minion-adhoc and minion-policy list
    # their own fields, and the default itself is covered by tests/integration/salt_path/test_default_call_params.py.
    allow_call_params: []
    ssl_certs_dir_root: /etc/salt/sqlx-certs
  profiles:
    # ---------------------------------------------------------------- PostgreSQL (sakiladb/postgres)
    pg_ro: &pg_ro {<<: *d, dialect: postgresql, host: pg, port: 5432, database: sakila, username: ro, password: sdb://e2e_sdb/ro_pw}
    pg_rw: {<<: *pg_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false, allow_execute: true}
    # the read-only account with execute enabled: the database role, not the module, must refuse the write
    pg_ro_exec: {<<: *pg_ro, read_only: false, allow_execute: true}
    # the write account with the in-session read-only guard on (the default): sqlx.query must not write
    pg_rw_guarded: {<<: *pg_ro, username: rw, password: sdb://e2e_sdb/rw_pw}
    pg_ro_exec_off: {<<: *pg_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false}
    pg_badpw: {<<: *pg_ro, password: sdb://e2e_sdb/bad_pw}
    pg_nopw: {<<: *d, dialect: postgresql, host: pg, port: 5432, database: sakila, username: ro}
    pg_closed: {<<: *pg_ro, port: 5999}
    pg_unreach: {<<: *pg_ro, host: 10.254.254.254, connect_timeout_s: 3}
    pg_nohost: {<<: *pg_ro, host: no-such-host.invalid}
    pg_sdb_missing: {<<: *pg_ro, password: sdb://e2e_sdb/no_such_key}
    # every allowlisted query / connect_args key (SPEC section 7) on a real server
    pg_args: {<<: *pg_ro, query: {application_name: sqlx-e2e-q, target_session_attrs: any}, connect_args: {keepalives: 1, keepalives_idle: 30, keepalives_interval: 10, keepalives_count: 3}}
    pg_small: {<<: *pg_ro, row_limit: 5, max_bytes: 2000}
    # TLS-only PostgreSQL (official postgres:16 image, tests-e2e/tls); hostnossl is rejected there
    pg_tls: &pg_tls {<<: *d, dialect: postgresql, host: pg-tls, port: 5432, database: tlsdb, username: tls_pw, password: sdb://e2e_sdb/tls_pw, ssl_certs_dir: /etc/salt/sqlx-certs/ca-only}
    pg_tls_cert: {<<: *pg_tls, username: tls_cert, ssl_certs_dir: /etc/salt/sqlx-certs/good}
    pg_tls_nocert: {<<: *pg_tls, username: tls_cert}
    pg_tls_wrongca: {<<: *pg_tls, ssl_certs_dir: /etc/salt/sqlx-certs/wrong-ca}
    pg_tls_otherclient: {<<: *pg_tls, username: tls_cert, ssl_certs_dir: /etc/salt/sqlx-certs/other-client}
    pg_tls_badname: {<<: *pg_tls, host: pg-tls-alias}
    pg_tls_plain: {<<: *d, dialect: postgresql, host: pg-tls, port: 5432, database: tlsdb, username: tls_pw, password: sdb://e2e_sdb/tls_pw, query: {sslmode: disable}}

    # ---------------------------------------------------------------- MySQL (sakiladb/mysql)
    mysql_ro: &mysql_ro {<<: *d, dialect: mysql, host: mysql, port: 3306, database: sakila, username: ro, password: sdb://e2e_sdb/ro_pw}
    mysql_rw: {<<: *mysql_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false, allow_execute: true}
    # the read-only account with execute enabled: the database role, not the module, must refuse the write
    mysql_ro_exec: {<<: *mysql_ro, read_only: false, allow_execute: true}
    # the write account with the in-session read-only guard on (the default): sqlx.query must not write
    mysql_rw_guarded: {<<: *mysql_ro, username: rw, password: sdb://e2e_sdb/rw_pw}
    mysql_ro_exec_off: {<<: *mysql_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false}
    mysql_badpw: {<<: *mysql_ro, password: sdb://e2e_sdb/bad_pw}
    mysql_nopw: {<<: *d, dialect: mysql, host: mysql, port: 3306, database: sakila, username: ro}
    mysql_closed: {<<: *mysql_ro, port: 3999}
    mysql_unreach: {<<: *mysql_ro, host: 10.254.254.254, connect_timeout_s: 3}
    mysql_nohost: {<<: *mysql_ro, host: no-such-host.invalid}
    # every allowlisted query / connect_args key (SPEC section 7) on a real server
    mysql_args: {<<: *mysql_ro, connect_args: {charset: utf8mb4, read_timeout: 20, write_timeout: 20}}
    mysql_small: {<<: *mysql_ro, row_limit: 5, max_bytes: 2000}
    mysql_tls: &mysql_tls {<<: *d, dialect: mysql, host: mysql-tls, port: 3306, database: tlsdb, username: tls_pw, password: sdb://e2e_sdb/tls_pw, ssl_certs_dir: /etc/salt/sqlx-certs/ca-only}
    mysql_tls_cert: {<<: *mysql_tls, username: tls_cert, password: sdb://e2e_sdb/tls_cert_pw, ssl_certs_dir: /etc/salt/sqlx-certs/good}
    mysql_tls_nocert: {<<: *mysql_tls, username: tls_cert, password: sdb://e2e_sdb/tls_cert_pw}
    mysql_tls_wrongca: {<<: *mysql_tls, ssl_certs_dir: /etc/salt/sqlx-certs/wrong-ca}
    mysql_tls_otherclient: {<<: *mysql_tls, username: tls_cert, password: sdb://e2e_sdb/tls_cert_pw, ssl_certs_dir: /etc/salt/sqlx-certs/other-client}
    mysql_tls_badname: {<<: *mysql_tls, host: mysql-tls-alias}
    mysql_tls_plain: {<<: *d, dialect: mysql, host: mysql-tls, port: 3306, database: tlsdb, username: tls_pw, password: sdb://e2e_sdb/tls_pw, connect_args: {ssl_disabled: true}}

    # ---------------------------------------------------------------- MariaDB (sakiladb/mariadb); dialect is mysql (D10)
    mariadb_ro: &mariadb_ro {<<: *d, dialect: mysql, host: mariadb, port: 3306, database: sakila, username: ro, password: sdb://e2e_sdb/ro_pw}
    mariadb_rw: {<<: *mariadb_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false, allow_execute: true}
    # the read-only account with execute enabled: the database role, not the module, must refuse the write
    mariadb_ro_exec: {<<: *mariadb_ro, read_only: false, allow_execute: true}
    # the write account with the in-session read-only guard on (the default): sqlx.query must not write
    mariadb_rw_guarded: {<<: *mariadb_ro, username: rw, password: sdb://e2e_sdb/rw_pw}
    mariadb_ro_exec_off: {<<: *mariadb_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false}
    mariadb_badpw: {<<: *mariadb_ro, password: sdb://e2e_sdb/bad_pw}
    mariadb_nopw: {<<: *d, dialect: mysql, host: mariadb, port: 3306, database: sakila, username: ro}
    mariadb_closed: {<<: *mariadb_ro, port: 3999}
    mariadb_unreach: {<<: *mariadb_ro, host: 10.254.254.254, connect_timeout_s: 3}
    mariadb_nohost: {<<: *mariadb_ro, host: no-such-host.invalid}
    # every allowlisted query / connect_args key (SPEC section 7) on a real server
    mariadb_args: {<<: *mariadb_ro, connect_args: {charset: utf8mb4, read_timeout: 20, write_timeout: 20}}
    mariadb_small: {<<: *mariadb_ro, row_limit: 5, max_bytes: 2000}
    mariadb_tls: &mariadb_tls {<<: *d, dialect: mysql, host: mariadb-tls, port: 3306, database: tlsdb, username: tls_pw, password: sdb://e2e_sdb/tls_pw, ssl_certs_dir: /etc/salt/sqlx-certs/ca-only}
    mariadb_tls_cert: {<<: *mariadb_tls, username: tls_cert, password: sdb://e2e_sdb/tls_cert_pw, ssl_certs_dir: /etc/salt/sqlx-certs/good}
    mariadb_tls_nocert: {<<: *mariadb_tls, username: tls_cert, password: sdb://e2e_sdb/tls_cert_pw}
    mariadb_tls_wrongca: {<<: *mariadb_tls, ssl_certs_dir: /etc/salt/sqlx-certs/wrong-ca}
    mariadb_tls_otherclient: {<<: *mariadb_tls, username: tls_cert, password: sdb://e2e_sdb/tls_cert_pw, ssl_certs_dir: /etc/salt/sqlx-certs/other-client}
    mariadb_tls_badname: {<<: *mariadb_tls, host: mariadb-tls-alias}
    mariadb_tls_plain: {<<: *d, dialect: mysql, host: mariadb-tls, port: 3306, database: tlsdb, username: tls_pw, password: sdb://e2e_sdb/tls_pw, connect_args: {ssl_disabled: true}}

    # ---------------------------------------------------------------- Oracle (sakiladb/oracle, service SAKILA)
    oracle_ro: &oracle_ro {<<: *d, dialect: oracle, host: oracle, port: 1521, database: SAKILA, username: ro, password: sdb://e2e_sdb/ro_pw}
    oracle_rw: {<<: *oracle_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false, allow_execute: true}
    # the read-only account with execute enabled: the database role, not the module, must refuse the write
    oracle_ro_exec: {<<: *oracle_ro, read_only: false, allow_execute: true}
    # the write account with the in-session read-only guard on (the default): sqlx.query must not write
    oracle_rw_guarded: {<<: *oracle_ro, username: rw, password: sdb://e2e_sdb/rw_pw}
    oracle_ro_exec_off: {<<: *oracle_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false}
    oracle_badpw: {<<: *oracle_ro, password: sdb://e2e_sdb/bad_pw}
    oracle_nopw: {<<: *d, dialect: oracle, host: oracle, port: 1521, database: SAKILA, username: ro}
    oracle_closed: {<<: *oracle_ro, port: 1599}
    oracle_unreach: {<<: *oracle_ro, host: 10.254.254.254, connect_timeout_s: 3}
    oracle_nohost: {<<: *oracle_ro, host: no-such-host.invalid}
    # every allowlisted query / connect_args key (SPEC section 7) on a real server
    oracle_args: {<<: *oracle_ro, connect_args: {expire_time: 1, retry_count: 1, retry_delay: 1}}
    oracle_small: {<<: *oracle_ro, row_limit: 5, max_bytes: 2000}
    # TLS: NOT RUN against a server (no TCPS listener in the Sakila image); validation only (needs ewallet.pem)
    oracle_tls: {<<: *oracle_ro, port: 2484, ssl_certs_dir: /etc/salt/sqlx-certs/ca-only}

    # ---------------------------------------------------------------- SQL Server (sakiladb/sqlserver, database sakila)
    mssql_ro: &mssql_ro {<<: *d, dialect: mssql, host: mssql, port: 1433, database: sakila, username: ro, password: sdb://e2e_sdb/ro_pw}
    mssql_rw: {<<: *mssql_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false, allow_execute: true}
    # the read-only account with execute enabled: the database role, not the module, must refuse the write
    mssql_ro_exec: {<<: *mssql_ro, read_only: false, allow_execute: true}
    # the write account with the in-session read-only guard on (the default): sqlx.query must not write
    mssql_rw_guarded: {<<: *mssql_ro, username: rw, password: sdb://e2e_sdb/rw_pw}
    mssql_ro_exec_off: {<<: *mssql_ro, username: rw, password: sdb://e2e_sdb/rw_pw, read_only: false}
    mssql_badpw: {<<: *mssql_ro, password: sdb://e2e_sdb/bad_pw}
    mssql_nopw: {<<: *d, dialect: mssql, host: mssql, port: 1433, database: sakila, username: ro}
    mssql_closed: {<<: *mssql_ro, port: 1499}
    mssql_unreach: {<<: *mssql_ro, host: 10.254.254.254, connect_timeout_s: 3}
    mssql_nohost: {<<: *mssql_ro, host: no-such-host.invalid}
    # every allowlisted query / connect_args key (SPEC section 7) on a real server
    mssql_args: {<<: *mssql_ro, connect_args: {appname: sqlx-e2e-app, charset: UTF-8, tds_version: '7.4'}}
    mssql_small: {<<: *mssql_ro, row_limit: 5, max_bytes: 2000}
    # TLS with a certificate directory is refused for mssql (SPEC 3.1)
    mssql_tls: {<<: *mssql_ro, ssl_certs_dir: /etc/salt/sqlx-certs/ca-only}
