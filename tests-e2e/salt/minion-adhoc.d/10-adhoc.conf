# Only on the `minion-adhoc` container: no sqlx profiles at all. Every connection detail comes from the call
# (SPEC section 3.2, ad-hoc connections), limited to the five test databases on their standard ports.
master: master
log_level_logfile: debug

e2e_sdb:
  driver: yaml
  files:
    - /etc/salt/e2e-secrets.yaml

sqlx:
  _policy:
    allow_call_params: [dialect, driver, host, port, database, username, password, ssl_mode, ssl_certs_dir, ssl_files,
                        query, connect_args, connect_timeout_s, statement_timeout_ms, read_only]
    allow_adhoc_connection: true
    allowed_hosts: [pg, mysql, mariadb, oracle, mssql]
    allowed_ports: [5432, 3306, 1521, 1433]
