# Only on the `minion-policy` container: call-time connection parameters (SPEC section 3.2) for a restricted host list.
sqlx:
  default_profile: pg_ro
  _policy:
    ssl_certs_dir_root: /etc/salt/sqlx-certs
    allow_call_params: [host, port, database, username, password, connect_timeout_s, statement_timeout_ms, read_only]
    allowed_hosts: [pg, mysql, mariadb, oracle, mssql]
    allowed_ports: [5432, 3306, 1521, 1433]
