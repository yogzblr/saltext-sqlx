# Throw-away master for the end-to-end suite. Never reuse these users or passwords.
id: e2e-master
interface: 0.0.0.0
auto_accept: true          # test network only: every minion on the private compose network is accepted
log_level_logfile: debug
keep_jobs_seconds: 86400

rest_cherrypy:
  port: 8000
  host: 0.0.0.0            # inside the container; compose publishes it on 127.0.0.1 only
  disable_ssl: true        # plain HTTP on the private test network and loopback; never do this on a real master
netapi_enable_clients:
  - local

external_auth:
  file:
    ^filename: /etc/salt/e2e-eauth.txt
    ^hashtype: plaintext
    # read-only operators: query and ping, read profiles only (anchored regex)
    sre_ops:
      - '*':
          - sqlx.query:
              kwargs:
                profile: '^(pg|mysql|mariadb|oracle|mssql)_ro$'
          - sqlx.ping:
              kwargs:
                profile: '^(pg|mysql|mariadb|oracle|mssql)_ro$'
    # writers: execute on the write profiles only
    dba_writers:
      - '*':
          - sqlx.execute:
              kwargs:
                profile: '^(pg|mysql|mariadb|oracle|mssql)_rw$'
    # connections given in the call (minion-adhoc): no profile to match, so the rule pins the host and the dialect
    adhoc_ops:
      - 'minion-adhoc':
          - sqlx.query:
              kwargs:
                host: '^(pg|mysql)$'
                dialect: '^(postgresql|mysql)$'
          - sqlx.ping:
              kwargs:
                host: '^(pg|mysql)$'
                dialect: '^(postgresql|mysql)$'
    # test harness only: every sqlx function on every profile, so that the suite can drive all six functions and
    # the error matrix through salt-api. Not an example for production.
    e2e_full:
      - '*':
          - 'sqlx.*'
