# TLS-only PostgreSQL for the end-to-end suite (first match wins). Plain TCP is rejected; tls_cert must present a
# client certificate (CN=tls_cert); tls_pw authenticates with a password over TLS.
local     all    all                    trust
host      all    postgres 127.0.0.1/32  trust
hostnossl all    all      0.0.0.0/0     reject
hostssl   tlsdb  tls_cert 0.0.0.0/0     cert clientcert=verify-full
hostssl   tlsdb  tls_pw   0.0.0.0/0     scram-sha-256
