# Where the master finds the saltexts state, the orchestration, the wheelhouse (salt://saltexts/wheels/<kernel>-<arch>) and the pillar.
file_roots:
  base:
    - /srv/salt
pillar_roots:
  base:
    - /srv/pillar
# a new wheelhouse is visible to minions only after this cache expires (default 20 s): a run in that window fails the checksum
# check loudly (see deploy/README.md) and succeeds on the next run
fileserver_list_cache_time: 20
